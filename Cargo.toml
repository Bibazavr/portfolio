[workspace]
resolver = "3"
members = ["crates/content", "crates/classic", "crates/plaza"]

[workspace.package]
edition = "2024"
publish = false

[workspace.dependencies]
content = { path = "crates/content" }
askama = "0.16.1"
ron = "0.12.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"

# Release builds are the plaza's WASM, so they optimise for size. The site
# generator runs as a dev build and isn't affected.
[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
