<!doctype html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
	<title data-ru="{{ self.ru(p.identity.name) }} — {{ self.ru(p.identity.title) }}">{{ self.en(p.identity.name) }} — {{ self.en(p.identity.title) }}</title>
	<meta name="description" content="{{ self.en(p.identity.summary) }}">
	<meta name="theme-color" content="#dde3e8">
	<link rel="canonical" href="{{ p.site.url }}/">
	<link rel="icon" href="/favicon.svg" type="image/svg+xml">

	<meta property="og:type" content="profile">
	<meta property="og:title" content="{{ self.en(p.identity.name) }} — {{ self.en(p.identity.title) }}">
	<meta property="og:description" content="{{ self.en(p.identity.summary) }}">
	<meta property="og:url" content="{{ p.site.url }}/">
	<meta property="og:site_name" content="{{ p.identity.handle }}">
	<meta property="profile:username" content="{{ p.identity.handle }}">
	<meta name="twitter:card" content="summary">

	<style>
		/* The background matches the plaza's sky, so loading doesn't flash. */
		html, body {
			margin: 0;
			height: 100%;
			overflow: hidden;
			background: #dde3e8;
			color: #14171a;
			font: 16px/1.4 ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
		}

		#plaza {
			position: fixed;
			inset: 0;
			display: block;
			width: 100%;
			height: 100%;
			outline: none;
			touch-action: none;
		}

		.classic {
			position: fixed;
			z-index: 1;
			top: max(12px, env(safe-area-inset-top));
			right: max(12px, env(safe-area-inset-right));
			padding: 10px 16px;
			border: 1px solid #e2e4de;
			border-radius: 12px;
			background: rgb(250 250 247 / 0.88);
			-webkit-backdrop-filter: blur(8px);
			backdrop-filter: blur(8px);
			color: #14171a;
			font-weight: 600;
			font-size: 15px;
			text-decoration: none;
		}

		.classic:hover {
			border-color: #7851a9;
		}

		.classic:focus-visible {
			outline: 2px solid #7851a9;
			outline-offset: 3px;
		}

		/* Shown only once the script below has run, so it can't hang there without JS. */
		#loading {
			display: none;
		}

		.js #loading:not([hidden]) {
			display: grid;
		}

		.loading {
			position: fixed;
			inset: 0;
			display: grid;
			place-items: center;
			margin: 0;
			padding: 0 24px;
			text-align: center;
			color: #5a6067;
			pointer-events: none;
		}
	</style>

	<script>
		// Runs before anything else loads. Picks the language, then sends devices
		// that can't run the plaza well to the classic page. `?play` skips the check.
		(function () {
			var params = new URLSearchParams(location.search);
			var lang = params.get('lang');
			if (lang !== 'en' && lang !== 'ru') {
				lang = 'en';
				var preferred = navigator.languages || [navigator.language || ''];
				for (var i = 0; i < preferred.length; i++) {
					var code = String(preferred[i]).slice(0, 2).toLowerCase();
					if (code === 'en' || code === 'ru') {
						lang = code;
						break;
					}
				}
			}
			document.documentElement.lang = lang;
			document.documentElement.classList.add('js');
			window.plazaLang = lang;
			if (params.has('play')) return;

			function hasFastWebGL2() {
				try {
					var gl = document.createElement('canvas')
						.getContext('webgl2', { failIfMajorPerformanceCaveat: true });
					if (!gl) return false;
					var context = gl.getExtension('WEBGL_lose_context');
					if (context) context.loseContext();
					return true;
				} catch (error) {
					return false;
				}
			}

			var connection = navigator.connection || {};
			var tooWeak =
				Math.min(screen.width, screen.height) < 320 ||
				navigator.deviceMemory < 2 ||
				connection.saveData === true ||
				/(^|-)2g$/.test(connection.effectiveType || '') ||
				!hasFastWebGL2();
			if (tooWeak) {
				window.plazaRedirecting = true;
				location.replace(lang === 'ru' ? '{{ self.classic_path_ru() }}' : '{{ self.classic_path_en() }}');
			}
		})();
	</script>

	<script type="module">
		if (!window.plazaRedirecting) {
			if (window.plazaLang === 'ru') {
				for (const el of document.querySelectorAll('[data-ru]')) el.textContent = el.dataset.ru;
				for (const el of document.querySelectorAll('[data-ru-href]')) el.href = el.dataset.ruHref;
				for (const el of document.querySelectorAll('[data-ru-label]')) el.setAttribute('aria-label', el.dataset.ruLabel);
			}

			const builds = {{ self.builds_json()|safe }};
			const params = new URLSearchParams(location.search);

			// Bevy fixes the renderer at compile time, so there is one build per renderer.
			async function pickRenderer() {
				const forced = params.get('renderer');
				if (builds.includes(forced)) return forced;
				if (builds.includes('webgpu') && navigator.gpu) {
					try {
						if (await navigator.gpu.requestAdapter()) return 'webgpu';
					} catch (error) {}
				}
				return 'webgl2';
			}

			const renderer = await pickRenderer();
			if (renderer === 'webgpu') {
				// If WebGPU fails while starting up, reload once with WebGL2.
				const fallBack = () => {
					params.set('renderer', 'webgl2');
					location.replace(`${location.pathname}?${params}`);
				};
				addEventListener('error', fallBack, { once: true });
				setTimeout(() => removeEventListener('error', fallBack), 20000);
			}

			const base = `/plaza/${renderer}/`;
			try {
				const { default: init } = await import(`${base}plaza.js?v={{ version }}`);
				await init({ module_or_path: `${base}plaza_bg.wasm?v={{ version }}` });
			} catch (error) {
				// winit leaves Rust's event loop by throwing; that one isn't a failure.
				if (!String(error).includes('Using exceptions for control flow')) throw error;
			}
			document.getElementById('loading').hidden = true;
		}
	</script>
</head>
<body>
	<a class="classic" href="{{ self.classic_path_en() }}" data-ru="{{ self.ru(p.ui.classic_view) }}" data-ru-href="{{ self.classic_path_ru() }}">{{ self.en(p.ui.classic_view) }}</a>
	<canvas id="plaza" aria-label="{{ self.en(p.ui.plaza_label) }}" data-ru-label="{{ self.ru(p.ui.plaza_label) }}"></canvas>
	<p id="loading" class="loading" data-ru="{{ self.ru(p.ui.loading) }}">{{ self.en(p.ui.loading) }}</p>
	<noscript><p class="loading">{{ self.en(p.ui.needs_js) }} / {{ self.ru(p.ui.needs_js) }}</p></noscript>
</body>
</html>
