[package]
name = "plaza"
description = "The interactive skate plaza, built with Bevy and compiled to WASM."
version = "0.1.0"
edition.workspace = true
publish.workspace = true

[features]
default = ["webgl2"]
# Bevy picks one renderer at compile time, so the site ships one build per
# renderer and the shell page loads the WebGPU build where the browser has it.
webgl2 = ["bevy/webgl2"]
webgpu = ["bevy/webgpu"]

[dependencies]
avian3d = { version = "0.8.0", default-features = false, features = [
    "3d",
    "parry-f32",
    "collider-from-mesh",
    # Builds colliders for glTF scenes once they've spawned.
    "bevy_scene",
] }
bevy = { version = "0.20.1", default-features = false, features = [
    "std",
    "web",
    "async_executor",
    "bevy_asset",
    "bevy_log",
    # glTF scenes need their component types registered for reflection.
    "reflect_auto_register",
    "bevy_winit",
    "bevy_window",
    "bevy_render",
    "bevy_core_pipeline",
    "bevy_pbr",
    "bevy_light",
    "bevy_camera",
    "bevy_mesh",
    "bevy_color",
    "bevy_gltf",
    "bevy_world_serialization",
    "bevy_animation",
    "gltf_animation",
    "png",
    "bevy_state",
] }
bevy_asset_loader = { version = "0.28.1", default-features = false }
content.workspace = true
# Turns the font's glyphs into meshes for the plaza's 3D text.
meshtext = "0.3.2"
# Compiles info and debug logging out of release builds: smaller, and no
# source paths in the console.
tracing = { version = "0.1.44", default-features = false, features = ["release_max_level_warn"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
# Matches the wasm-bindgen that Bevy's web stack already pulls in.
wasm-bindgen = "0.2.130"
