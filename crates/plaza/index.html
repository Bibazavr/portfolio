<!doctype html>
<!--
	Development page for `trunk serve`. The deployed site doesn't use it: the
	shell page from crates/classic loads the build instead (see build.sh).
-->
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Plaza (dev)</title>
	<script>
		// The shell page shows panels here; the dev page only logs them.
		window.plazaBridge = {
			show: (spot) => console.log('panel:', spot),
			hide: () => console.log('panel: none'),
			sound: () => {},
			motion: () => {},
			trick: (kind, points, total) => console.log(`${kind} +${points} = ${total}`),
		};
	</script>
	<!-- wasm-opt needs the WebAssembly features rustc's wasm32 target emits by default. -->
	<link data-trunk rel="rust" data-bin="plaza" data-type="main" data-wasm-opt="z"
		data-wasm-opt-params="--enable-bulk-memory --enable-bulk-memory-opt --enable-nontrapping-float-to-int --enable-sign-ext --enable-mutable-globals --enable-reference-types --enable-multivalue">
	<style>
		html, body { margin: 0; height: 100%; overflow: hidden; background: #dde3e8; }
		canvas { display: block; width: 100%; height: 100%; outline: none; }
	</style>
</head>
<body>
	<canvas id="plaza"></canvas>
</body>
</html>
